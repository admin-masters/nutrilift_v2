{% extends 'base.html' %}{% block content %}<a class="back-link" href="{% url 'dashboard' %}">← Back to school</a><div class="narrow"><div class="page-heading"><div><span class="eyebrow">{{ school.name }}</span><h1>Share link with class teachers</h1></div></div>
<section class="panel form-panel"><div class="invitation-tools"><button class="btn secondary" type="button" data-copy="invitation">Copy invitation</button><a class="standalone-link" href="{% url 'team' %}">Manage class access</a></div><p id="copy-status" class="small" role="status"></p>
<form id="invite-form" autocomplete="off"><div class="field"><label for="invite-name">Teacher’s name <span class="muted">(optional)</span></label><input id="invite-name" maxlength="80" autocomplete="off" data-private></div><div class="field"><label for="invite-phone">WhatsApp number</label><input id="invite-phone" type="tel" inputmode="tel" required placeholder="98765 43210 or +91 98765 43210" autocomplete="off" data-private></div><button class="btn primary full" type="submit">Share via WhatsApp ↗</button><p id="invite-status" role="status"></p></form>
<details class="invitation-details"><summary>View invitation and registration link</summary><label class="field-label" for="invitation">School invitation</label><textarea id="invitation" rows="7" readonly>{{ invitation }}</textarea><label class="field-label" for="invite-url">School registration link</label><input id="invite-url" value="{{ invitation_url }}" readonly></details><p class="muted small">The invitation includes your school’s registration link and screening guide.</p></section></div>{% endblock %}
