name: Test and deploy NutriLift

on:
  push:
    branches: [Production, Staging]
  pull_request:
    branches: [Production, Staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nutrilift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Django tests and deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Django and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Test application and deployment script
        run: |
          bash -n scripts/deploy_ec2.sh
          shellcheck scripts/deploy_ec2.sh
          python -m pytest -q
      - name: Verify static collection
        run: python manage.py collectstatic --noinput

  deploy:
    name: Deploy Production to EC2
    needs: test
    if: >-
      github.repository == 'admin-masters/nutrilift_v2' &&
      github.ref == 'refs/heads/Production' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pull, migrate, collect static, and restart services
        shell: bash
        env:
          EC2_IP: ${{ secrets.EC2_IP }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$EC2_IP" ]] || { echo 'Missing repository secret EC2_IP'; exit 1; }
          [[ -n "$EC2_SSH_KEY" ]] || { echo 'Missing repository secret EC2_SSH_KEY'; exit 1; }
          [[ "$EC2_IP" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]] || { echo 'EC2_IP must be a hostname or IP address'; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/nutrilift-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          if [[ -n "$EC2_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$EC2_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          else
            # Trust on first use; set EC2_KNOWN_HOSTS to pin a verified host key.
            ssh-keyscan -T 10 -H "$EC2_IP" > "$ssh_dir/known_hosts"
          fi
          ssh -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            "ubuntu@$EC2_IP" "bash -s -- $GITHUB_SHA" < scripts/deploy_ec2.sh
